name: ThriveHive
description: ThriveHive was a Boston-based guided marketing platform for small businesses (10 or
  fewer employees), founded in 2011 by Max Faingezicht and Adam Blake and part of the Techstars
  Boston 2015 class. It was acquired by Propel Marketing (GateHouse Media) in 2016 for $11.8M and
  the brand was folded into Gannett's LocaliQ after the 2019 GateHouse-Gannett merger. The company
  published no public API or developer portal; thrivehive.com now serves LocaliQ content behind an
  expired TLS certificate.
